<html lang="zh-CN">
<head>

<title>军事理论刷题 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 300px; max-height: 380px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.status-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.status-circle {
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid #d1d5db;
  color: var(--text-secondary);
  background: var(--surface);
}
.status-circle:hover { transform: scale(1.15); border-color: var(--primary-light); }
.status-circle.done { background: var(--correct); color: #fff; border-color: var(--correct); }
.status-circle.current { border-color: var(--primary); border-width: 2.5px; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: none; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-secondary);
  transition: all var(--transition); flex-shrink: 0;
}
.back-btn:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f3f9; }
.back-btn.visible { display: flex; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  text-align: center; box-shadow: var(--shadow-md); max-width: 320px; width: 90%;
}
.confirm-dialog p { font-size: 14px; margin-bottom: 16px; color: var(--text); }
.confirm-dialog .btns { display: flex; gap: 10px; }
.confirm-dialog .btns .btn { flex: 1; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>

施。 （\t）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "孙武所著的《孙胺兵法》继承和发展了《孙子兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（\t）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "《兵役法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（\t）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "国防的根本目的和任务是保卫国家的领土完整。（\t）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "根据我国的社会制度和国家政策，中国的国防类型是中立型。（\t）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "国防的基本要素包括国防的性质 、国防的目的、国防的手段和国防的对象四个方面。（）", "answer": false}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "颠覆是指推翻现政府的一种叛逆行为，包括武装暴力颠覆和非武装暴力颠覆两种形式。 （\t）", "answer": true}, {"chapter": "中国国防", "type": "tf", "id": 0, "question": "国防的根本目的和任务是保卫国家的统一。（\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "不同历史时期的战略， 有着不同的内容和特点， 其决定因素主要有战略思想、战略环境和军事力量。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略思想是国家对待军事斗争特别是战争问题的根本立场和态度，是指导军事斗争的基本观点和理论原则。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略的基本要素包括战略目的、战略方针、战略力量和战略手段。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略力量是战略的物质基础和支柱。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略目的和战略 手段是战略行动的方向、目标、纲领和准则。（\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略即筹划和指导战争全局的方略，是指根据对国际形势和敌对双方政治、军事、外交、科技、地理等诸因素的分析和判断，科学地预测战争的发生与发展，制定作战方针、作战原则和作战计划，筹划战争准备，指导战争实施所遵循的原则和方法。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战略是为准备和进行战争而实行的具有全局意义的实行战略的保障，是战略决策机构根据战争的需要，在政治、军事、外交、经济、科学技术和战略  领导与指挥等方面，所采取的各种全局性的切实可行的方法和步骤。 （\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "日傍美制华，并不甘心为美火中取栗。(\t)", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "军事斗争情况的发展变化，决定着军事斗争指导规律的发展变化，战略必须随着军事斗争的发展而发展，依照情况的变化而变化，一成不变的战略是不存在的。（ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "战争是解决阶级和阶级、民族和民族、国家与国家、政治集团和政治集团之间利益矛盾和冲突的最激烈的手段。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "对于一个国家的主权和安全来说，来自内部的威胁是最严重的威胁。（）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "当代世界战争与和平的趋势在国际战略环境中最引人注目，也是世界各国研究和制定军事战略时关注的中心。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "地理环境不仅是制定战略的重要客观依据，而且是影响战争胜负的重要因素。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "在“10+3”机制的带动下，东亚各国在非传统安全领域的合作正不断加强。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "“一带一路”不是一个实体和机制，而是合作发展的理念和倡议，是依靠中国与有关国家既有的双多边机制，借助既有的、行之有效的区域合作平台。（）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。 （ ）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "一切军事斗争和军事活动，归根结底都要依靠综合国力，特别是经济、科技和军事实力的支撑，并受其制约 。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "2014年10月24日，包括中国、印度、新加坡等在内21个首批意向创始成员国的财长和授权代表在北京签约，共同决定成立亚太经合组织。  （\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "国际战略格局是指国际社会中国际战略力量之间在一定历史时期内相互联系、相互作用而形成的具有全球性的、相对稳定的力量对比结构及基本态势。（）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "一个国家或国家集团在国际社会中的行为能力和影响力，固然要取决于多种因索，但军事实力是其中最基本的、长期起作用的决定性因素。 （\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "美国在第二次世界大战后成为资本主义世界的霸主， 重要的原因就是它拥有世界上最强大的经济和军事实力。从历史上看， 国际战略格局的发展变化， 往往以世界经济格局的发展为先导。（ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "一定的国际秩序总是由在国际战略格局中居于主导地位的国家或国家集团制定的，或是在很大程度上受到这些国家意志的制约和影响。（ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "国际秩序一经建立，它对国际战略格局会起到强制性的维护作用，但在旧格局解体的情况下，原有的国际秩序不会在一定范围和一定程度上继续产生影响。（）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "第二次世界大战以前，国际秩序的本质特征是强权政治和殖民政治。（）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "国际战略格局按其范围大小，也可以区分为世界格局和地区格局，这两个层次既有其独立性，又有其关联性。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "真正具有世界意义的国际战略格局是在现代资本主义发展的基础上形成和发展起来的。 （ ）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "第二次世界大战后，世界秩序被重新安排，形成了以凡尔赛—华盛顿体系为基础的两极格局。 （ ）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "苏联解体，使持续了近半个世纪的东西方美苏两大集团之间激烈对抗的冷战格局彻底终结。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "美国“一超独霸”的局面是两极体制被打破后的一种过渡现象，在这个过渡期内，国际战略格局呈现的基本态势将是“一超多强”，又是一个终将被多极体制所取代的暂时历史进程。（ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "亚太经合组织是当今世界上规模最大、一体化程度最高的地区经济集团，具有雄厚的经济、科技和军事实力。（ ）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "江泽民早在1990年初就曾指出：“所谓多极，中国算一极，中国不要贬低自己，怎么样也算一极。”（   ）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "世界将在地缘上分为欧洲、原苏联地区、亚太、中东、拉美和非洲等六大军事区域，形成各具特色的地区军事格局。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "东盟各国的“东盟地区论坛”已成为亚太地区第一个政府间的多边安全对话机制。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "上海合作组织把打击三股势力、维护地区安全与稳定作为首要任务，近年来还逐步加强合作打击中亚地区日益严重的毒品走私活动，把遏制和铲除毒品走私纳入反恐合作的框架之中。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "美国的“新干涉主义” 和战略扩张成为国际局势动荡的根源。（\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "总体稳定是世界形势的主流。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "两极世界解体后，全球性的军事对抗已不复存在，爆发世界大战的可能性越来越小。 （）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "金融安全在国家经济安全乃至整个国家安全中的战略地位空前上升， 并相对军事安全而言成为当代国家安全斗争的又一主战场。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "共建“一带一路”致力于亚欧非大陆及附近海洋的互联互通，建立和加强沿线各国互联互通伙伴关系，构建全方位、多层次、复合型的互联互通网络，实现沿线各国多元、自主、平衡、可持续的发展。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "我国是世界上拥有邻国最多的国家。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "中国周边地区也是世界上大国最集中的地区，且多为军事强国。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "从地缘政治的角度看，美国也是中国的邻国，因为它在中国周边有强大的力量存在和战略影响。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "台湾海峡是连接太平洋和印度洋的海上交通咽喉，扼控两洋航线的枢纽，是亚太各国经贸发展的“生命阀”。 （\t）", "answer": false}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "当今世界五大热点地区：中东波斯湾、中亚、南亚次大陆、台湾海峡、朝鲜半岛，几乎都在中国周边。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "为打破美、前苏两个超级大国对我国实施的战略包围，我国先后采取了一系列重大战略性举措。从抗美援朝、中印边境自卫反击战、援越抗美斗争到中越边境自卫还击作战等，有力地打击了霸权主义行径。 （ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "新中国成立到20世纪60年代，对我国独立和安全的威胁主要来自美国。美国不甘心在中国内地的失败，长期推行政治上孤立、经济上封锁、军事上威胁的反华、仇华政策。（ ）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "钓鱼诸岛自古以来一直是中国领土不可分割的部分。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "2009年至今，中国海监执法船、中国海警巡航编队多次开赴钓鱼岛，既是依法行使对中国领土钓鱼岛及其附近海域的巡航执法，也是中国行使对钓鱼岛主权的具体体现。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "南海是我国同东南亚各国交往的重要纽带，南沙群岛是拱卫我国南大门的第一道海上战略屏障，也是保卫海上通道安全的前沿阵地。 （\t）", "answer": true}, {"chapter": "国家安全", "type": "tf", "id": 0, "question": "国际恐怖势力在中国周边的频繁滋事，恶化了中国周边环境，直接危害着中国国家安全。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事思想具有鲜明的阶级性、强烈的时代感、丰富的实践性和明显的继承性。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事思想来源于人类的军事实践，同时又给人类的军事实践以理论指导。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事思想来源于社会实践，在阶级社会中，人们为了各自阶级的利益，所奉行和推崇的军事思想，必然反映各个阶级对战争和军队建设的认识和立场。因此军事思想具有强烈的时代感。（）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事思想是一个历史范畴，不同历史时期的战争有着不同的形态和战略战术，有着不同的军队组织原则和编制，军事思想随着人类社会的发展而不断演变。因此军事思想具有强烈的时代感。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事思想是由军事实践产生，受军事实践的检验，随着军事实践的发展而发展，任何军事思想都是对战争实践的经验总结和升华。因此军事思想具有明显的继承性。 （ ）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "军事理论的继承和发展都离不开对以往军事思想的扬弃，是人们对以往的军事实践认识成果中正确理论的继承和发展。因此军事思想具有明显的继承性。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "一般认为我国古代军事思想的初步形成于夏商周时期（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "一般认为我国古代军事思想在春秋战国时期进入系统化、体系化阶段。（）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "宋神宗时期，把《孙子兵法》《孙胺兵法》、《六韬》、《黄石公三略》、《尉缭子》、《司马法》、《李卫公问对》等七部兵书作为武学必修课程，统称《武经七书》。（ ）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "毛泽东在人民战争的战略战术思想中提出，战争以歼灭敌人有生力量作为作战的主要目标，不以保守或夺取城市和地方为主要目标。（\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "江泽民提出“部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力”。 ( )", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "胡锦涛提出“我们必须统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会进程中实现富国和强军的统一”。 ( )", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "中国第一部军事地理学专著是《武经总要》。（\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "与中国古代军事思想相比，世界古代军事思想起步较晚，反映了该时期军事思想的著作有《伯罗奔尼撒战争史》、《希腊波斯战争史》、《罗马军制》、《长征记》等。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "近代无产阶级军事思想的代表人物是拿破仑、马克思、恩格斯、列宁。（）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "反映了近代无产阶级军事思想的著作有《共产党宣言》、《德国农民战争》、《法兰西内战》、《战争艺术概论》等。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "马克思主义军事理论的诞生，为人们研究和解决军事领域的问题提供了科学的基本观点和方法，为无产阶级军事思想的发展奠定了坚实的理论基础。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论战 争本质观的战争本质的观点。（\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "认为战争并不是自有人类以来就有的 ， 战争是人类社会发展到一定历史阶段的产物。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“人口论”认为，古时候人少、财物多，所以没有争斗和战争，后来人口不断增多，社会财富相对减少，人们为了争夺生存条件就发生了战争。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "对待战争的态度中，“偃兵废武论”认为兵是凶器，争是逆德，因此主张“偃武修文”，实行文治。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "习近平提出“实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。可以说，这个梦想是强国梦，对军队来说，也是强军梦。我们要实现中华民族伟大复兴，必须坚持富国和强军相统一，努力建设巩固国防和强大军队。”（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "对待战争的态度中，“义兵慎战论”认为战争并不是绝对的坏事，对战争要具体分析，明确表明要支持正义战争，反对非正义战争。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "明太祖在《谕将帅》中提出“发兵为诛暴，诛暴为保民”，“诛暴保民论”体现了中国古代军事思想中战争论的战争和平观。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论的战争本质观。 （ ）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《孙膑兵法》中提出“富国”是“强兵之急＂，这体现了中国古代军事思想中战争论的战争政治观。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《淮南子》中指出“兵之胜败，本在于政”，这体现了中国古代军事思想中战争论的战争和平观。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "邓小平根据现代战争的特点和规律，结合我国的实际情况，提出了“现代条件下人民战争”的思想。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《孙子兵法》中强调“上兵伐谋，其次伐交”，这体现了中国古代军事思想战备论中战备的内容是外交上备战。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“寓兵于政”、“寓兵于农”、“寓兵于刑”、“寓兵于乐”，强调要注意备战的相称性原则。（\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "我国古代的军事家、政治家认为战备的最 高标准和目标，就是在政治、经济、军事、技术等各有关决定战争胜负的诸因素方面，相对于敌人来说都要占有绝对优势。这体现了备战的整体性原则。（ ）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“耕战并重”强调了备战的超前性原则。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "“有民则有兵，无民而兵不可为也”，这体现了中国古代军事思想中治军论的“军以民为本”。(\t)", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《孙子兵法》中提出“治众如治寡，分数是也”，这体现了中国古代军事思想中治军论的“凡兵，制必先定”。 (\t)", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "戚继光的《纪效新书》中指出“有精器而无精兵以用之，是谓徒费；有精兵而无精器，是谓徒强”，这体现了中国古代军事思想中治军论的“凡胜，备必先具”。 (\t)", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "诸葛亮强调“夫用兵之道，必定其谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "岳飞讲“勇不足恃，用兵在先定谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "邓小平运用辩证唯物主义和历史唯物主义的原理， 研究指导中国革命战争，创造性地提出了“军事辩证法”这一概念。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "孙武指出“兵贵胜，不贵久”， 这体现了中国古代军事思想中用兵论的“兵之情主速”的观点。（\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《太白阴经》强调“道贵制人，不贵制于人；制人者握权，制于人者遵命也”，这体现了中国古代军事思想中用兵论的“致人而不致于人”的观点。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "岳飞讲“运用之妙，存乎一心”，这体现了中国古代军事思想中用兵论的“因机立胜”的观点。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《孙子兵法》中提出“兵形象水，水因地而制流，兵因敌而制胜”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。（\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《尉缭子》中认为“权先加人者，兵敌不力交；武先加人者，敌无威接”，这体现了中国古代军事思想中用兵论的“先胜而后求战”的观点。（\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "遵义会议后， 确定了以毛泽东为首的党中央领导集体。（）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "帝国主义和霸权主义是现代战争的根源。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "司马光主张“才者，德之资也；德者，才之帅也”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （\t）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《鬼谷子》中提出“智者不用其所短，而用愚人之所长；不用其所拙，而用愚人之所丁”，这体现了中国古代军事思想中将帅选拔任用的优化性原则。 （ ）", "answer": true}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《吕氏春秋》指出“以人之小恶，亡人之大美，此人主之所以失天下之士也”，这体现了中国古代军事思想中将帅选拔任用的开放性原则。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《汉书》中提出“论大功者不录小过，举大美者不庇疵细瑕”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （\t）", "answer": false}, {"chapter": "军事思想", "type": "tf", "id": 0, "question": "《孙子兵法》是中国现存最早的兵书，也是世界上最早的军事著作， 被誉为“兵学圣典”。 (\t)", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化战争是指发生在信息时代，以信息为基础并以信息化武器装备为主要战争工具和作战手段，以系统集成和信息控制为主导，在全维空间内通过精确打击、实时控制、信息攻防等方式进行的瘫痪和震慑作战。 （ ）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "最早提出信息战概念的人是钱学森。（\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息具有可量度、可识别、可转换、可储存、可处理、可传递、可再生、可压缩、实效性、可共享等特征。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "在信息化战争中，除进行物质力量的较量之外，更主要的是知识的较量，即创新能力和创新速度的竞赛，知识成为战争毁灭力的主要来源。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第四次浪潮战争”。 (\t)", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“非接触战争”。 (\t)", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "中国著名的军事理论家孙武，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "首次利用空中卫星进行战场侦察的战争是第三次中东战争。（\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "马岛战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "海湾战争中，英军还以“竞技神”号、“无敌”号航空母舰上的电子干扰系统和“鹄”式直升机上的机载干扰系统，对阿军的袭击兵器和指挥控制系统实施了电磁干扰与压制。 （ ）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "朝鲜战争中，美国军队依靠优势空中力量进行长时间”地毯式轰炸”的空袭作战，以及直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。（）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "高技术战争的萌芽阶段中，具有代表性的战争是朝鲜战争和越南战争。（）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是第四次中东战争和海湾战争。 （ ）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "标志着高技术战争的发展进入成熟阶段的是科索沃战争。 （）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "海湾战争中的通信系统建设 被称为“军事史上一次最大的通信系统专项工程。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "马岛战争中，开创了“爱国者 ” 导弹成功拦截“飞毛腿” 导弹的先例。（）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化战争的雏形阶段中，典型的是美军先后发起的科索沃战争、阿富汗战争及伊拉克战争。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化战争是以信息的获取权、控制权和使用权为核心进行的争夺。（）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "现代战争的作战样式可以表现为阵地战、运动战、游击战、闪击战、持久战等各种作战样式。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "我国第一款自主研制的预警机是空警-2001。 ()", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "空警-2000预警机创造了世界预警机发展史上的9个第一，突破100余项关键技术，累 计获得重大专利近30项，是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。（ ）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "战争潜力削弱战是综合运用硬摧毁与软杀伤的手段，削弱对方为战争服务或使用的人力、物力、科学技术和精神等诸多因素构成的潜在的战争力量，破坏对方将战争潜力转为战争实力的转换机制，动摇对方的战争基础，使对方无法继续进行战争， 从而达到迅速战胜对方的目的。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "战争结构破坏战是以破坏和瘫痪敌战场认识系统、信息处理系统和指挥控制系统为主要作战目标，综合运用以信息技术为核心的武器装备、作战系统和作战手段，剥夺敌战场信息获取权、控制权和使用权，使敌决策者和指挥机关难以下定决心和进行有效的作战指挥。（）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "指挥中枢瘫痪战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。（）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "心理系统瓦解战以改变个体和群体心理状态为目标，运用各种形态的信息媒介，从认识、情绪和意志上打击瓦解敌人的一种作战样式。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息时代的信息化战争则是在陆地、海洋、空中、太空、电磁、网络、心理等多维空间内进行的一体化作战。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "在网络化的战场上，发现目标、作出决策、下达命令和实施作战行动等环节不是实时同步进行的。 （\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "随着计算机、电子通信、卫星技术和信息化武器装备的发展，信息化战争的作战节奏和作战速度将比机械化战争大大提高，持续时间明显缩短，呈现出迅疾短促的特征。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化战争中，物资、能源的地位更为突出，是主要的战略资源。 （\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "在信息化战争以前的战争中，信息资源处于首要的位置，成为最重要的战略资源。（）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "精确战的实施依赖于透明度很高的战场。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "没有高素质的军人，既打不赢机械化战争，更打不赢信息化战争。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息技术发展越快，信息化战争的经济科技依赖性越弱。（\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第五代战争”。 (\t)", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "中国著名的军事理论家孙子，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "首次利用空中卫星进行战场侦察的战争是第四次中东战争。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "标志着高技术战争的发展进入成熟阶段的是海湾战争。 （ ）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "科索沃战争中的通信系统建设被称为“军事史上一次最大的通信系统专项工程”。()", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "越南战争中，开创了“爱国者”导弹成功拦截“飞毛腿”导弹的先例。( )", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息化是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （\t）", "answer": false}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "最早提出信息战概念的人是中国人沈伟光。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "信息主要由信源、语言、载体、信道、信宿和媒介构成。（\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第三次浪潮战争”。 (\t)", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第六代战争”。 (\t)", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "战争结构破坏战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。 （\t）", "answer": true}, {"chapter": "现代理论", "type": "tf", "id": 0, "question": "首次利用空中卫星进行战场侦察的战争是越南战争。（\t）", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "当战争进入信息化时代后,信息化武器系统也必然成为战争新的主流器。(   )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "以信息技术为代表的科学技术的发展是信息化战争形成的物质技术基础。(   )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "武器装备的高技术化实质上就是信息化。(   )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "战争除了在物质领域进行摧残与反摧残外,还在信息领域进行激励对抗。(   )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "所谓信息化武器系统,是指在信息构成上大量应用先进的电子技术的武器系统。(   )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争中军队建设从强调数量向注重质量转变。(   )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在战争目的的控制上目标为“不必打死它,只要打服它”。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在作战范围的控制上,是根据自己的作战能力来确定交战范围。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在投入兵力控制上,强调人多势众,注重合理运用。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在由区域战场向全球战场延伸。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在由空中战场向太空战场延伸。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争在由有形战场向无形战场延伸。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "军事对抗只有在信息化战争中是一种系统对抗。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争中整个作战体系的作战效能是各个作战体系效能的相加。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "“非致命战”、“计算机病毒战”属于全新作战方式。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "军队指挥自动化系统的产生是计算机走上战场的标志。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争作为21世纪中的主要战争形态,不会改变战争的本质。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争是核威慑下的高技术常规战争,意味着信息化战争就是核战争。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "机械化战争的作战指挥控制是扁平状的网络结构,这就使得指挥控制层次多,指挥效能\n和决策速度慢。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "科索沃战争是世界战争史上的第一次“信息战争”。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "海湾战争中美军所确立的作战理论引起了战争形态的显著变化。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "地面部队数字化将改变传统力量的结构模式,引起作战方式的根本性变革。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "伊拉克战争是美国进行的一场信息化战争。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "在信息技术不断融入战争力量的过程中,几种传统战争力量间是平衡的,只是地面部队相对慢些。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "上下级平等机制不属于完善国防动员体制中的机制。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "常备军和后备力量是构成国防的两大基本要素。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "强大的国防是由常备军、后备力量、国防科技、国防工业、军事理论、战略战术思想等多种因素构成的。其中,常备军是基础,后备力量是骨干。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "强大的国防后备力量是我国武装力量的主要组成部分,是现代国防的重要基础。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "机械化战争是数量决定效能。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "从纯军事角度看,阿富汗战争实质上就是一场高技术条件下的信息战。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "科索沃战争是一场典型的信息时代的信息化战争与工业时代的机械化战争之间的非对称性较量。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "阿富汗战争告诉我们,建立在卫星监控技术之上的远程导弹精确打击和准确拦截技术,已成为未来战争成败的关键。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争是时代的产物,是世界政治、经济、科技、军事、文化等多种因素综合作用的结果,但它当前仍处于初始阶段。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "列宁说过,“战例是人类战争史上极其辉煌与悲壮的记载,但是对于未来战争的指挥艺术而言,像是一幅日渐褪色的油画”。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "美军对过去的战略和三军的作战理论进行了全面的审查,于1992年正式提出了以对付局部战争威胁为主要目标的“地区防务战”战略。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "在世界战争史上,海湾战争是第一次被人们称作“信息战争”的战例。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "夺取战场主动权的关键是制信息权。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "机械化战争是信息决定效能。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "不断更新的信息技术是信息化战争形成的先导。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "海湾战争发生在1990年1月。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "国防力量建设中,常备军是基础。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "战争走过了冷兵器时代、火器时代、机械化战争时代,现在正逐步向信息化战争时代过渡。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争是政治、经济、科技等因素作用的结果。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "未来战争形式中也包括了电磁战。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "“海湾战争”是冷战结束以后参战国最多的一场局部战争。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "20世纪90年代初,东欧剧变,两德统一,美苏两极格局迅速解体。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "火力战的显著特点中不包括高速度。(    )", "answer": false}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "游击战、运动战、阵地战被称为“老三战”的作战形式。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "政治是引发战争最根本的诱因。(    )", "answer": true}, {"chapter": "信息化武装", "type": "tf", "id": 0, "question": "信息化战争形成的“催产剂”是不断发展的科学技术。(    )", "answer": false}];

var SITE_CONFIG = {"storagePrefix": "military_quiz", "siteName": "军事理论"};

var mode = null, subMode = null, currentQuestions = [], currentIndex = 0;
var userAnswers = {}, showFeedback = {}, practiceDone = {};
var sessionKey = 'history_quiz_session';
var sessionDoneKey = 'history_quiz_done';

if (typeof SITE_CONFIG === 'object' && SITE_CONFIG.storagePrefix) {
  sessionKey = SITE_CONFIG.storagePrefix + '_session';
  sessionDoneKey = SITE_CONFIG.storagePrefix + '_done';
}

function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function persistSession() {
  try {
    if (mode && currentQuestions.length > 0) {
      localStorage.setItem(sessionKey, JSON.stringify({
        mode: mode, subMode: subMode,
        questions: currentQuestions,
        index: currentIndex,
        answers: userAnswers,
        feedback: showFeedback
      }));
    } else {
      localStorage.removeItem(sessionKey);
    }
  } catch(e) {}
}

function resumeSession() {
  try {
    var raw = localStorage.getItem(sessionKey);
    if (!raw) return false;
    var s = JSON.parse(raw);
    if (!s || !s.questions || !s.questions.length) return false;
    mode = s.mode || null; subMode = s.subMode || null;
    currentQuestions = s.questions; currentIndex = s.index || 0;
    userAnswers = s.answers || {}; showFeedback = s.feedback || {};
    if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
    return true;
  } catch(e) { return false; }
}

function getGlobalIdx(q) {
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    if (ALL_QUESTIONS[i].chapter === q.chapter && ALL_QUESTIONS[i].type === q.type && ALL_QUESTIONS[i].id === q.id) return i;
  }
  return -1;
}

function loadPracticeDone() {
  try { var d = localStorage.getItem(sessionDoneKey); practiceDone = d ? JSON.parse(d) : {}; } catch(e) { practiceDone = {}; }
}
function savePracticeDone() {
  try { localStorage.setItem(sessionDoneKey, JSON.stringify(practiceDone)); } catch(e) {}
}
function isDone(q) { return !!practiceDone[getGlobalIdx(q)]; }
function markDone(q) { practiceDone[getGlobalIdx(q)] = true; savePracticeDone(); }

function goBack() {
  if (Object.keys(userAnswers).length === 0) {
    doGoBack();
    return;
  }
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-dialog"><p>确定要返回吗？<br>当前答题进度将丢失。</p><div class="btns"><button class="btn btn-outline btn-sm" id="confirmCancel">取消</button><button class="btn btn-primary btn-sm" id="confirmOk" style="background:#c0392b">确认返回</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmCancel').addEventListener('click', function() { overlay.remove(); });
  overlay.querySelector('#confirmOk').addEventListener('click', function() { overlay.remove(); doGoBack(); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function doGoBack() {
  if (mode === 'practice' && subMode) {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  } else if (mode === 'test') {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    mode = null;
    persistSession();
    renderMain();
  } else {
    mode = null; subMode = null;
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  }
}

function renderHeader() {
  var backBtn = document.getElementById('headerBackBtn');
  var el = document.getElementById('headerRight');
  if (!mode || currentQuestions.length === 0) {
    el.innerHTML = '';
    backBtn.classList.remove('visible');
    return;
  }
  backBtn.classList.add('visible');
  var total = currentQuestions.length;
  var answered = Object.keys(userAnswers).length;
  var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  var html = '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-text">' + answered + '/' + total + '</span></div>';
  html += '<div style="position:relative"><button class="status-btn" id="statusBtn">📋</button><div class="status-panel" id="statusPanel"></div></div>';
  el.innerHTML = html;
  document.getElementById('statusBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    var panel = document.getElementById('statusPanel');
    renderStatusPanel();
    panel.classList.toggle('show');
  });
  document.addEventListener('click', function() { var p = document.getElementById('statusPanel'); if (p) p.classList.remove('show'); });
}

function renderStatusPanel() {
  var el = document.getElementById('statusPanel'); if (!el) return;
  var total = currentQuestions.length;
  var doneCount = 0;
  var html = '<h4>完成状态（<span id="statusDoneCount">0</span>/' + total + '）<br><span style="font-weight:400;font-size:11px">绿色=已答 灰色=未答 蓝色框=当前</span></h4><div class="status-grid">';
  currentQuestions.forEach(function(q, i) {
    var d = (userAnswers[i] !== undefined);
    if (mode === 'practice') d = d || isDone(q);
    if (d) doneCount++;
    var cur = (i === currentIndex) ? ' current' : '';
    html += '<div class="status-circle' + (d ? ' done' : '') + cur + '" data-idx="' + i + '" title="第' + (i+1) + '题' + (d ? ' ✓' : '') + '">' + (i + 1) + '</div>';
  });
  html += '</div>';
  if (mode === 'test') {
    html += '<div style="text-align:center;margin-top:14px"><button class="btn btn-primary btn-sm" id="panelSubmitBtn" style="width:auto;padding:8px 32px;background:#c0392b">提交试卷</button></div>';
  }
  el.innerHTML = html;
  el.querySelector('#statusDoneCount').textContent = doneCount;
  el.querySelectorAll('.status-circle').forEach(function(circle) {
    circle.addEventListener('click', function(e) {
      e.stopPropagation();
      currentIndex = parseInt(circle.dataset.idx);
      renderQuiz();
      el.classList.remove('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  var psb = el.querySelector('#panelSubmitBtn');
  if (psb) psb.addEventListener('click', function(e) {
    e.stopPropagation();
    if (Object.keys(userAnswers).length === 0) { alert('请至少回答一道题再提交'); return; }
    var ok = confirm('确定要提交试卷吗？未作答的题目将计为错误。');
    if (ok) {
      el.classList.remove('show');
      renderResult(document.getElementById('main'));
      renderHeader();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
}

function renderMain() {
  var el = document.getElementById('main');
  if (!mode) { renderModeSelect(el); }
  else if (currentQuestions.length === 0) { renderSubModeSelect(el); }
  else { renderQuiz(); }
  renderHeader();
}

function renderModeSelect(el) {
  var totalCount = ALL_QUESTIONS.length;
  el.innerHTML = '<div class="page-title"><h2>军事理论</h2><p>题库练习与测试系统 · 共 ' + totalCount + ' 题</p></div><div class="mode-grid"><div class="mode-card" data-mode="practice"><div class="icon">📝</div><h3>刷题模式</h3><p>按题型分类练习<br>即时反馈，记录进度</p></div><div class="mode-card" data-mode="test"><div class="icon">📋</div><h3>测试模式</h3><p>单选20题 + 多选20题 + 判断10题<br>每题2分，满分100分</p></div></div>';
  el.querySelectorAll('.mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      mode = card.dataset.mode;
      currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
      if (mode === 'test') { startTest(); } else { persistSession(); renderMain(); }
    });
  });
}

function renderSubModeSelect(el) {
  var counts = { single: 0, multi: 0, tf: 0 };
  ALL_QUESTIONS.forEach(function(q) { counts[q.type]++; });
  el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px"><button class="btn btn-outline btn-sm" id="backBtn">← 返回</button><h2 style="font-weight:600;font-size:17px">刷题模式 · 选择题型</h2></div><div class="sub-mode-grid"><div class="sub-mode-card" data-sub="single">单选题<br><span style="font-size:12px;color:var(--text-secondary);font-weight:400">' + counts.single + ' 题</span></div><div class="sub-mode-card" data-sub="multi">多选题<br><span style="font-size:12px;color:var(--text-secondary);font-weight:400">' + counts.multi + ' 题</span></div><div class="sub-mode-card" data-sub="tf">判断题<br><span style="font-size:12px;color:var(--text-secondary);font-weight:400">' + counts.tf + ' 题</span></div></div>';
  el.querySelector('#backBtn').addEventListener('click', function() { mode = null; persistSession(); renderMain(); });
  el.querySelectorAll('.sub-mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      subMode = card.dataset.sub;
      currentQuestions = ALL_QUESTIONS.filter(function(q) { return q.type === subMode; });
      currentIndex = 0; userAnswers = {}; showFeedback = {};
      persistSession();
      renderMain();
    });
  });
}

function startTest() {
  var singles = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; })).slice(0, 20);
  var multis = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; })).slice(0, 20);
  var tfs = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'tf'; })).slice(0, 10);
  currentQuestions = singles.concat(multis).concat(tfs);
  currentIndex = 0; userAnswers = {}; showFeedback = {};
  persistSession();
  renderMain();
}

function renderQuiz() {
  var el = document.getElementById('main');
  var total = currentQuestions.length;
  if (currentIndex >= total) { renderResult(el); renderHeader(); return; }
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  var typeLabel = { single: '单选题', multi: '多选题', tf: '判断题' }[q.type];
  var hasAnswered = showFeedback[currentIndex];
  var userAns = userAnswers[currentIndex];
  var optionsHtml = '';
  if (q.type === 'tf') {
    var tfLabels = ['对', '错'];
    var tfLetters = ['A', 'B'];
    optionsHtml = '<div class="options">';
    tfLabels.forEach(function(label, i) {
      var cls = 'option';
      var ansVal = i === 0;
      if (hasAnswered) cls += ' disabled';
      if (userAns !== undefined && userAns === ansVal) cls += ' selected';
      if (hasAnswered) {
        if (q.answer === ansVal) cls += ' correct';
        if (userAns !== undefined && userAns === ansVal && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-answer="' + ansVal + '"><span class="option-letter">' + tfLetters[i] + '</span><span>' + label + '</span></div>';
    });
    optionsHtml += '</div>';
  } else if (q.type === 'multi') {
    optionsHtml = (hasAnswered ? '' : '<div class="multi-hint">可多选，选择后点击确认</div>') + '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      var selected = userAns && userAns.indexOf(opt.label) !== -1;
      if (selected) cls += ' selected';
      if (hasAnswered) {
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (selected && q.answer.indexOf(opt.label) === -1) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  } else {
    optionsHtml = '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      if (userAns === opt.label) cls += ' selected';
      if (hasAnswered) {
        if (opt.label === q.answer) cls += ' correct';
        if (userAns === opt.label && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  }

  var feedbackHtml = '';
  if (hasAnswered) {
    var isMulti = q.type === 'multi';
    var userDisplay, correctDisplay, isCorrect;
    if (isMulti) {
      userDisplay = userAns ? userAns.split('').sort().join('') : '未作答';
      correctDisplay = q.answer;
      isCorrect = (userAns || '').split('').sort().join('') === q.answer;
    } else if (q.type === 'tf') {
      userDisplay = userAns === true ? '对' : userAns === false ? '错' : '未作答';
      correctDisplay = q.answer === true ? '对' : '错';
      isCorrect = userAns === q.answer;
    } else {
      userDisplay = userAns || '未作答';
      correctDisplay = q.answer;
      isCorrect = userAns === q.answer;
    }
    feedbackHtml = '<div class="feedback show ' + (isCorrect ? 'correct' : 'incorrect') + '">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误，正确答案是 <strong>' + correctDisplay + '</strong>') + '</div>';
  }

  var submitBtnHtml = '';
  if (mode === 'test' && !hasAnswered) {
    submitBtnHtml = '<button class="btn btn-outline btn-sm" id="submitBtn" style="flex:0;background:#c0392b;color:#fff;border-color:#c0392b">提交</button>';
  }

  var navHtml = '';
  var isLast = (currentIndex >= total - 1);
  if (hasAnswered) {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    navHtml += '<button class="btn btn-primary" id="nextBtn">' + (isLast ? '查看结果' : '下一题') + '</button>';
  } else {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    if (q.type === 'multi') {
      navHtml += '<button class="btn btn-primary" id="confirmBtn" style="flex:1">确认答案</button>';
    } else {
      if (mode === 'test' && isLast) {
        navHtml += '<button class="btn btn-primary" id="submitTestBtn" style="flex:1;background:#c0392b">提交</button>';
      } else {
        navHtml += '<button class="btn btn-outline" id="skipBtn">下一题</button>';
      }
    }
  }

  el.innerHTML = '<div class="quiz-header"><div class="quiz-info"><span>' + typeLabel + '</span> · 第 <span>' + qNum + '</span>/<span>' + total + '</span> 题' + (mode === 'test' ? '' : '<span class="chapter-tag">' + q.chapter + '</span>') + '</div></div><div class="question-card"><div class="question-num">第 ' + qNum + ' 题</div><div class="question-text">' + q.question + '</div>' + optionsHtml + feedbackHtml + '</div><div class="nav-btns">' + navHtml + '</div>';

  if (!hasAnswered) {
    if (q.type === 'single') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.label;
          showFeedback[currentIndex] = true;
          if (mode === 'practice') markDone(q);
          renderQuiz(); renderHeader(); persistSession();
        });
      });
    } else if (q.type === 'multi') {
      if (!userAnswers[currentIndex]) userAnswers[currentIndex] = '';
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          var label = opt.dataset.label;
          var sel = userAnswers[currentIndex] || '';
          userAnswers[currentIndex] = sel.indexOf(label) !== -1 ? sel.replace(label, '') : sel + label;
          renderQuiz();
        });
      });
      var cb = el.querySelector('#confirmBtn');
      if (cb) cb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    } else if (q.type === 'tf') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.answer === 'true';
          showFeedback[currentIndex] = true;
          if (mode === 'practice') markDone(q);
          renderQuiz(); renderHeader(); persistSession();
        });
      });
    }
    var sb = el.querySelector('#skipBtn');
    if (sb) sb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var stb = el.querySelector('#submitTestBtn');
    if (stb) stb.addEventListener('click', function() {
      var ok = confirm('确定要提交吗？未作答的题目将计为错误。');
      if (ok) { renderResult(el); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  }

  var pb = el.querySelector('#prevBtn');
  if (pb) pb.addEventListener('click', function() { currentIndex--; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var nb = el.querySelector('#nextBtn');
  if (nb) nb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function renderResult(el) {
  var total = currentQuestions.length;
  var correct = 0, singleTotal = 0, singleCorrect = 0, multiTotal = 0, multiCorrect = 0, tfTotal = 0, tfCorrect = 0;
  var wrongIdx = [];
  currentQuestions.forEach(function(q, i) {
    var ua = userAnswers[i], isCorrect;
    if (q.type === 'multi') { isCorrect = (ua || '').split('').sort().join('') === q.answer; }
    else { isCorrect = ua === q.answer; }
    if (isCorrect) correct++; else wrongIdx.push(i);
    if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
    else if (q.type === 'multi') { multiTotal++; if (isCorrect) multiCorrect++; }
    else { tfTotal++; if (isCorrect) tfCorrect++; }
  });
  var score = mode === 'test' ? correct * 2 : correct;
  var maxScore = mode === 'test' ? total * 2 : total;
  var pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  var gridHtml = '';
  if (singleTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + singleCorrect + '/' + singleTotal + '</div><div class="label">单选题</div></div>';
  if (multiTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + multiCorrect + '/' + multiTotal + '</div><div class="label">多选题</div></div>';
  if (tfTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + tfCorrect + '/' + tfTotal + '</div><div class="label">判断题</div></div>';

  el.innerHTML = '<div class="result-card"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">' + (mode === 'test' ? '测试完成' : '章节完成') + '</div><div class="result-score">' + score + '<span style="font-size:18px;color:var(--text-secondary);font-weight:400"> / ' + maxScore + '</span></div><div class="result-detail">正确率 ' + pct + '% · 共 ' + total + ' 题，答对 ' + correct + ' 题</div><div class="result-grid">' + gridHtml + '</div><div style="display:flex;gap:10px"><button class="btn btn-outline" id="reviewBtn" style="flex:1">查看错题 (' + wrongIdx.length + ')</button><button class="btn btn-primary" id="restartBtn" style="flex:1">' + (mode === 'test' ? '重新测试' : '返回') + '</button></div></div>';

  el.querySelector('#restartBtn').addEventListener('click', function() {
    if (mode === 'test') { currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; startTest(); }
    else { mode = null; subMode = null; currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; persistSession(); renderMain(); }
  });
  el.querySelector('#reviewBtn').addEventListener('click', function() {
    if (wrongIdx.length === 0) { alert('全部正确，没有错题！'); return; }
    currentIndex = wrongIdx[0];
    renderQuiz(); renderHeader(); persistSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

loadPracticeDone();
document.getElementById('headerBackBtn').addEventListener('click', goBack);

function renderResumeBanner() {
  var main = document.getElementById('main');
  if (!main) return;
  var banner = document.createElement('div');
  banner.style.cssText = 'background:#eef2fa;border:1px solid #2d5a9e;color:#1e3a5f;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap';
  banner.innerHTML = '<span>检测到上次的答题进度：第 <strong id="resumeIdx"></strong> 题（共 ' + currentQuestions.length + ' 题）</span><span style="display:flex;gap:8px"><button id="resumeBtn" style="background:#1e3a5f;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:13px;cursor:pointer;font-weight:600">继续答题</button><button id="discardBtn" style="background:#fff;color:#6b7280;border:1px solid #d1d5db;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer">放弃进度</button></span>';
  main.insertBefore(banner, main.firstChild);
  document.getElementById('resumeIdx').textContent = currentIndex + 1;
  document.getElementById('resumeBtn').addEventListener('click', function() { renderMain(); });
  document.getElementById('discardBtn').addEventListener('click', function() {
    mode = null; subMode = null; currentQuestions = []; currentIndex = 0;
    userAnswers = {}; showFeedback = {};
    persistSession();
    renderMain();
  });
}

function startApp() {
  if (resumeSession()) {
    renderModeSelect(document.getElementById('main'));
    renderResumeBanner();
  } else {
    renderMain();
  }
}

window.addEventListener('beforeunload', persistSession);

startApp();
</script>
</body>
</html>
